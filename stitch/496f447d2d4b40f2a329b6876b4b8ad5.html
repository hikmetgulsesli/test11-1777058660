<!DOCTYPE html>

<title>Sayfa Bulunamadı - Kısa Link</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>

            line-height: 1;
            letter-spacing: normal;
            text-transform: none;

            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>

<body class="bg-surface-dim text-on-surface font-body min-h-screen flex flex-col items-center justify-center relative overflow-hidden antialiased">
<!-- Ambient Void Glow -->
<div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-surface-container-low/60 via-surface-dim to-surface-dim z-0 pointer-events-none"></div>
<main class="z-10 flex flex-col items-center text-center max-w-2xl px-6 w-full">
<!-- Error Icon Container with Tonal Layering -->
<div class="mb-10 relative group cursor-default">
<!-- Subtle error glow -->
<div class="absolute inset-0 bg-error/10 blur-[40px] rounded-full scale-[2] transition-opacity duration-700 opacity-70 group-hover:opacity-100"></div>
<div class="bg-surface-container-highest w-28 h-28 rounded-full flex items-center justify-center relative z-10 shadow-[0_20px_40px_rgba(0,0,0,0.4)] ring-1 ring-white/5">
<span class="material-symbols-outlined text-5xl text-error" data-icon="link_off" data-weight="fill" style="font-variation-settings: 'FILL' 1;">link_off</span>
</div>
</div>
<!-- 404 Data Mark -->
<div class="font-mono text-8xl md:text-9xl font-bold text-surface-container-highest/80 tracking-tighter absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-[80%] -z-10 select-none pointer-events-none">
            404
        </div>
<!-- Typography: Editorial Precision -->
<h1 class="text-3xl md:text-4xl font-bold font-headline tracking-tight text-on-surface mb-4">
            Bu kısa link artık mevcut değil
        </h1>
<p class="text-lg md:text-xl text-on-surface-variant font-body mb-12 max-w-md mx-auto leading-relaxed">
            Girdiğiniz bağlantı silinmiş veya süresi dolmuş olabilir.
        </p>
<!-- Primary Action -->
<a class="bg-primary-container text-on-primary-container font-label text-base font-medium px-8 py-3.5 rounded-lg hover:bg-inverse-primary hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 flex items-center gap-2 shadow-[0_10px_30px_rgba(37,99,235,0.15)] ring-1 ring-white/10" href="/">
<span class="material-symbols-outlined text-xl" data-icon="arrow_back">arrow_back</span>

        </a>
