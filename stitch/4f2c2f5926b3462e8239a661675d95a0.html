<!DOCTYPE html>

<html class="dark" lang="tr"><head>

<title>Yönlendiriliyor - Kısa Link</title>

<link href="https://fonts.googleapis.com" rel="preconnect"/>

<style>

        }
    </style>

<body class="bg-surface-dim text-on-surface font-body h-screen w-full flex flex-col overflow-hidden relative">
<!-- The Void: Background ambient lighting -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-primary-container opacity-5 rounded-full blur-[120px] pointer-events-none"></div>
<!-- Main Content Canvas (Navigation suppressed due to transitional state) -->
<main class="flex-1 flex flex-col items-center justify-center relative z-10 px-6">
<!-- Status Container -->
<div class="flex flex-col items-center max-w-md w-full">
<!-- Connection Visual (Static representation of loading/routing) -->
<div class="flex items-center justify-center gap-4 mb-12">
<!-- Source -->
<div class="w-16 h-16 rounded-xl bg-surface-container-high border border-outline-variant/10 flex items-center justify-center shadow-2xl relative">
<span class="material-symbols-outlined text-primary text-2xl">link</span>
<!-- Active Indicator dot -->
<div class="absolute -top-1 -right-1 w-3 h-3 rounded-full bg-primary-container shadow-[0_0_8px_rgba(37,99,235,0.8)]"></div>
</div>
<!-- Path/Progress -->
<div class="flex flex-col items-center justify-center gap-2 w-24">
<span class="font-label text-xs tracking-wider text-on-surface-variant uppercase">Bağlanıyor</span>
<div class="flex justify-between w-full">
<div class="w-2 h-[2px] rounded-full bg-primary-container shadow-[0_0_4px_rgba(37,99,235,0.6)]"></div>

<div class="w-2 h-[2px] rounded-full bg-surface-variant"></div>
<div class="w-2 h-[2px] rounded-full bg-surface-variant"></div>
<div class="w-2 h-[2px] rounded-full bg-surface-variant"></div>
</div>
</div>
<!-- Destination -->
<div class="w-16 h-16 rounded-xl bg-surface-container-lowest flex items-center justify-center shadow-[inset_0_4px_12px_rgba(0,0,0,0.4)] border border-surface-container-low">
<span class="material-symbols-outlined text-outline text-2xl" style="font-variation-settings: 'wght' 200;">public</span>
</div>
</div>
<!-- Typography Content -->
<div class="text-center space-y-4 w-full">
<h1 class="text-2xl md:text-3xl font-headline font-semibold tracking-tight text-on-surface">
                    Orijinal adrese yönlendiriliyorsunuz...
                </h1>
<div class="pt-4 flex flex-col items-center gap-2">
<span class="font-label text-sm text-on-surface-variant">Hedef:</span>

<div class="px-4 py-2 bg-surface-container-low rounded-lg inline-flex items-center gap-2">
<span class="material-symbols-outlined text-outline-variant text-sm">lock</span>
<span class="font-mono text-primary text-sm tracking-wide">Yükleniyor...</span>
</div>
</div>
</div>
</div>
</main>

<div class="absolute bottom-8 left-0 right-0 flex justify-center text-center px-4">
